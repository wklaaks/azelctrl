<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="100" y2="100">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="dish" x1="0" y1="0" x2="100" y2="100">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#1f6feb"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
  <!-- Dish antenna - parabolic curve -->
  <path d="M22 78 Q50 10 78 78" fill="none" stroke="url(#dish)" stroke-width="4" stroke-linecap="round"/>
  <!-- Feed horn / antenna element -->
  <line x1="50" y1="50" x2="50" y2="18" stroke="#3fb950" stroke-width="3" stroke-linecap="round"/>
  <!-- Feed horn dot -->
  <circle cx="50" cy="50" r="5" fill="#3fb950"/>
  <!-- Signal waves -->
  <path d="M62 30 Q68 25 62 20" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M72 38 Q80 30 72 22" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <!-- Support arm -->
  <line x1="50" y1="50" x2="50" y2="82" stroke="#8b949e" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Base -->
  <rect x="32" y="78" width="36" height="6" rx="3" fill="#8b949e"/>
</svg>